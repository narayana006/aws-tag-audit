[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-tag-audit"
version = "0.1.0"
description = "Check AWS resources against your tagging policy: missing, empty or invalid tags, reported by service, account and owner."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
requires-python = ">=3.10"
dependencies = ["boto3>=1.26", "PyYAML>=6.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["pytest>=7", "moto[resourcegroupstaggingapi,ec2,s3]>=5.0"]

[project.scripts]
aws-tag-audit = "aws_tag_audit.cli:main"

[project.urls]
Homepage = "https://github.com/narayana006/aws-tag-audit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
